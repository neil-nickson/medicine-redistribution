<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - P.U.L.S.E</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
        },
        colors: {
          primary: '#10b981',
          primaryHover: '#059669',
        }
      }
    }
  }
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  body {
    background-color: #09090b; /* zinc-950 */
    color: #f4f4f5; /* zinc-100 */
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 selection:bg-primary selection:text-white relative overflow-hidden">

<!-- Background subtle element -->
<div class="absolute inset-0 -z-10 flex justify-center items-center opacity-20 pointer-events-none">
  <div class="w-[800px] h-[800px] bg-gradient-to-tr from-[#10b981] to-[#059669] rounded-full blur-3xl opacity-30 transform -translate-y-1/4"></div>
</div>

<div class="sm:mx-auto sm:w-full sm:max-w-md text-center z-10">
  <a href="/" class="inline-block">
    <h2 class="text-3xl font-bold tracking-tight text-white">P.U.L.S.E</h2>
  </a>
  <h2 class="mt-4 text-center text-xl font-medium tracking-tight text-zinc-300">
    Welcome back
  </h2>
  <p class="mt-2 text-center text-sm text-zinc-500">
    Login to your account
  </p>
</div>

<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md z-10">
  <div class="bg-zinc-900/80 backdrop-blur-xl py-8 px-4 border border-zinc-800 shadow-2xl sm:rounded-xl sm:px-10">
    <form class="space-y-6" id="loginForm">
      <div>
        <label for="email" class="block text-sm font-medium leading-6 text-zinc-300">Email address</label>
        <div class="mt-2">
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="your@email.com" class="block w-full rounded-md border-0 bg-zinc-950/50 py-1.5 text-white shadow-sm ring-1 ring-inset ring-zinc-800 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 px-3 placeholder:text-zinc-600 outline-none transition-shadow">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium leading-6 text-zinc-300">Password</label>
        <div class="mt-2">
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password" class="block w-full rounded-md border-0 bg-zinc-950/50 py-1.5 text-white shadow-sm ring-1 ring-inset ring-zinc-800 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 px-3 placeholder:text-zinc-600 outline-none transition-shadow">
        </div>
      </div>
      
      <div id="errorMsg" class="text-red-400 text-sm font-medium text-center empty:hidden"></div>

      <div>
        <button type="submit" class="flex w-full justify-center rounded-md bg-primary px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primaryHover focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors duration-200">Sign in</button>
      </div>
    </form>

    <p class="mt-10 text-center text-sm text-zinc-400">
      Don't have an account?
      <a href="/register" class="font-semibold leading-6 text-primary hover:text-primaryHover transition-colors duration-200">Sign up here</a>
    </p>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  
  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    
    const data = await response.json();
    
    if (response.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/dashboard';
    } else {
      errorMsg.textContent = data.error;
    }
  } catch (error) {
    errorMsg.textContent = 'Login failed. Please try again.';
  }
});
</script>

</body>
</html>
