<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - P.U.L.S.E</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
        },
        colors: {
          primary: '#10b981',
          primaryHover: '#059669',
        }
      }
    }
  }
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  body {
    background-color: #09090b; /* zinc-950 */
    color: #f4f4f5; /* zinc-100 */
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 selection:bg-primary selection:text-white relative overflow-hidden">

<!-- Background subtle element -->
<div class="absolute inset-0 -z-10 flex justify-center items-center opacity-20 pointer-events-none">
  <div class="w-[800px] h-[800px] bg-gradient-to-tr from-[#10b981] to-[#059669] rounded-full blur-3xl opacity-30 transform -translate-y-1/4 translate-x-1/4"></div>
</div>

<div class="sm:mx-auto sm:w-full sm:max-w-md text-center z-10">
  <a href="/" class="inline-block">
    <h2 class="text-3xl font-bold tracking-tight text-white">P.U.L.S.E</h2>
  </a>
  <h2 class="mt-4 text-center text-xl font-medium tracking-tight text-zinc-300">
    Create your account
  </h2>
  <p class="mt-2 text-center text-sm text-zinc-500">
    Join the network today
  </p>
</div>

<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-xl z-10">
  <div class="bg-zinc-900/80 backdrop-blur-xl py-8 px-4 border border-zinc-800 shadow-2xl sm:rounded-xl sm:px-10">
    <form class="space-y-5" id="registerForm">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="name" class="block text-sm font-medium leading-6 text-zinc-300">Full Name</label>
          <div class="mt-2">
            <input type="text" id="name" required class="block w-full rounded-md border-0 bg-zinc-950/50 py-1.5 text-white shadow-sm ring-1 ring-inset ring-zinc-800 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 px-3 placeholder:text-zinc-600 outline-none transition-shadow">
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium leading-6 text-zinc-300">Email address</label>
          <div class="mt-2">
            <input type="email" id="email" required class="block w-full rounded-md border-0 bg-zinc-950/50 py-1.5 text-white shadow-sm ring-1 ring-inset ring-zinc-800 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 px-3 placeholder:text-zinc-600 outline-none transition-shadow">
          </div>
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium leading-6 text-zinc-300">Password</label>
        <div class="mt-2">
          <input type="password" id="password" required class="block w-full rounded-md border-0 bg-zinc-950/50 py-1.5 text-white shadow-sm ring-1 ring-inset ring-zinc-800 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 px-3 placeholder:text-zinc-600 outline-none transition-shadow">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="organization_type" class="block text-sm font-medium leading-6 text-zinc-300">Organization Type</label>
          <div class="mt-2">
            <select id="organization_type" required class="block w-full rounded-md border-0 bg-zinc-950/50 py-2 text-white shadow-sm ring-1 ring-inset ring-zinc-800 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 px-3 outline-none transition-shadow appearance-none">
              <option value="" class="text-zinc-500">Select type</option>
              <option value="Hospital">Hospital</option>
              <option value="Pharmacy">Pharmacy</option>
              <option value="Clinic">Clinic</option>
              <option value="Medical Shop">Medical Shop</option>
            </select>
          </div>
        </div>

        <div>
          <label for="organization_name" class="block text-sm font-medium leading-6 text-zinc-300">Organization Name</label>
          <div class="mt-2">
            <input type="text" id="organization_name" required class="block w-full rounded-md border-0 bg-zinc-950/50 py-1.5 text-white shadow-sm ring-1 ring-inset ring-zinc-800 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 px-3 placeholder:text-zinc-600 outline-none transition-shadow">
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label for="location" class="block text-sm font-medium leading-6 text-zinc-300">Location (City)</label>
          <div class="mt-2">
            <input type="text" id="location" required class="block w-full rounded-md border-0 bg-zinc-950/50 py-1.5 text-white shadow-sm ring-1 ring-inset ring-zinc-800 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 px-3 placeholder:text-zinc-600 outline-none transition-shadow">
          </div>
        </div>

        <div>
          <label for="pincode" class="block text-sm font-medium leading-6 text-zinc-300">Pincode</label>
          <div class="mt-2">
            <input type="text" id="pincode" placeholder="560001" required class="block w-full rounded-md border-0 bg-zinc-950/50 py-1.5 text-white shadow-sm ring-1 ring-inset ring-zinc-800 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 px-3 placeholder:text-zinc-600 outline-none transition-shadow">
          </div>
        </div>
      </div>

      <div>
        <label for="phone" class="block text-sm font-medium leading-6 text-zinc-300">Phone (Optional)</label>
        <div class="mt-2">
          <input type="tel" id="phone" class="block w-full rounded-md border-0 bg-zinc-950/50 py-1.5 text-white shadow-sm ring-1 ring-inset ring-zinc-800 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 px-3 placeholder:text-zinc-600 outline-none transition-shadow">
        </div>
      </div>

      <div id="errorMsg" class="text-red-400 text-sm font-medium text-center empty:hidden"></div>

      <div class="pt-2">
        <button type="submit" class="flex w-full justify-center rounded-md bg-primary px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primaryHover focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors duration-200">Create Account</button>
      </div>
    </form>

    <p class="mt-10 text-center text-sm text-zinc-400">
      Already have an account?
      <a href="/login" class="font-semibold leading-6 text-primary hover:text-primaryHover transition-colors duration-200">Login here</a>
    </p>
  </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const formData = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    organization_type: document.getElementById('organization_type').value,
    organization_name: document.getElementById('organization_name').value,
    location: document.getElementById('location').value,
    pincode: document.getElementById('pincode').value, 
    phone: document.getElementById('phone').value
  };
  
  const errorMsg = document.getElementById('errorMsg');

  try {
    const response = await fetch('/api/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(formData)
    });

    const data = await response.json();

    if (response.ok) {
      alert('Registration successful! Please login.');
      window.location.href = '/login';
    } else {
      errorMsg.textContent = data.error;
    }

  } catch (error) {
    errorMsg.textContent = 'Registration failed. Try again.';
  }
});
</script>

</body>
</html>
